<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Evento Clinica!</title>
  <style>
    body {
      background-color: black;
      color: white;
      text-align: center;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden; /* Evita barras de desplazamiento */
    }

    button {
      background-color: #ff6600;
      color: black;
      border: none;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Estilo para la imagen de susto a pantalla completa */
    #susto-img {
      display: none; /* Oculta la imagen al cargar la página */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Llena toda la pantalla sin duplicar ni deformar */
      z-index: 999; /* La coloca por encima de todo */
    }
  </style>
</head>
<body>

  <div id="contenido">
    <h2>🎃 Presiona para ver la pista 🎃</h2>
    <button onclick="reproducirSusto()">TOCA AQUÍ</button>
  </div>

  <!-- Imagen de susto (reemplaza 'susto.jpg' por el nombre de tu archivo) -->
  <img id="susto-img" src="Mejorada.jpg" alt="Susto">

  <audio id="grito" src="grito.mp3" preload="auto"></audio>

  <script>
    function reproducirSusto() {
      // 1. Reproduce el audio del grito
      var audio = document.getElementById("grito");
      audio.play();

      // 2. Oculta el texto y el botón inicial
      document.getElementById("contenido").style.display = "none";

      // 3. Muestra la imagen de susto a pantalla completa
      document.getElementById("susto-img").style.display = "block";
    }
  </script>

</body>
</html>
